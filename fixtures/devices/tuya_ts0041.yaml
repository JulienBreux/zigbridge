schema_version: "1.0"
device:
    model: TS0041
    vendor: Tuya
    description: Wireless switch with 1 button
    zigbee_models:
        - TS0041
    endpoints:
        - endpoint: 1
          profile_id: 260
          device_id: 1025
          input_clusters:
            - 0
            - 1
          output_clusters:
            - 6
    exposes:
        - type: numeric
          name: battery
          property: battery
          description: Remaining battery in %
          unit: '%'
          min: 0
          max: 100
          access: 1
        - type: enum
          name: action
          property: action
          description: Triggered action (e.g. a button press)
          values:
            - single
            - double
            - hold
          access: 1
        - type: numeric
          name: linkquality
          property: linkquality
          description: Radio link quality indicator
          unit: lqi
          min: 0
          max: 255
          access: 1
    simulations:
        actions:
            double:
                cluster: 6
                command: 1
                mqtt_payload:
                    action: double
            hold:
                cluster: 6
                command: 0
                mqtt_payload:
                    action: hold
            single:
                cluster: 6
                command: 2
                mqtt_payload:
                    action: single
        telemetry:
            battery:
                cluster: 1
                attribute: 33
                voltage_attribute: 32
