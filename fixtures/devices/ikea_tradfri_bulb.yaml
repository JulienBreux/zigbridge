schema_version: "1.0"
device:
  model: "LED1624G9"
  vendor: "IKEA"
  description: "TRADFRI bulb E27 CWS 806lm"
  zigbee_models:
    - "TRADFRI bulb E27 CWS 806lm"
    - "LED1624G9"

  endpoints:
    - endpoint: 1
      profile_id: 0x0104 # Zigbee Home Automation (ZHA)
      device_id: 0x0102  # Color Dimmable Light
      input_clusters:
        - 0x0000 # genBasic
        - 0x0003 # genIdentify
        - 0x0004 # genGroups
        - 0x0005 # genScenes
        - 0x0006 # genOnOff
        - 0x0008 # genLevelCtrl
        - 0x0300 # lightingColorCtrl
      output_clusters:
        - 0x0019 # genOta

  exposes:
    - type: "binary"
      name: "state"
      property: "state"
      description: "On/off state of this light"
      values:
        - "ON"
        - "OFF"
      access: 7 # Read, Write, Report

    - type: "numeric"
      name: "brightness"
      property: "brightness"
      min: 0
      max: 254
      description: "Brightness of this light"
      access: 7

    - type: "numeric"
      name: "linkquality"
      property: "linkquality"
      unit: "lqi"
      min: 0
      max: 255
      description: "Radio link quality indicator"
      access: 1

  simulations:
    actions:
      toggle:
        cluster: 0x0006
        command: 0x02
        mqtt_payload:
          state: "TOGGLE"
    telemetry:
      light_state:
        cluster: 0x0006
        attribute: 0x0000
