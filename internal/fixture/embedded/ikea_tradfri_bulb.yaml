schema_version: "1.0"
device:
  model: "LED1624G9"
  vendor: "IKEA"
  description: "TRADFRI bulb E27 CWS 806lm"
  zigbee_models:
    - "TRADFRI bulb E27 CWS 806lm"
    - "LED1624G9"

  endpoints:
    - endpoint: 1
      profile_id: 0x0104
      device_id: 0x0102
      input_clusters:
        - 0x0000
        - 0x0003
        - 0x0004
        - 0x0005
        - 0x0006
        - 0x0008
        - 0x0300
      output_clusters:
        - 0x0019

  exposes:
    - type: "binary"
      name: "state"
      property: "state"
      description: "On/off state of this light"
      values:
        - "ON"
        - "OFF"
      access: 7

    - type: "numeric"
      name: "brightness"
      property: "brightness"
      min: 0
      max: 254
      description: "Brightness of this light"
      access: 7

    - type: "numeric"
      name: "linkquality"
      property: "linkquality"
      unit: "lqi"
      min: 0
      max: 255
      description: "Radio link quality indicator"
      access: 1

  simulations:
    actions:
      toggle:
        cluster: 0x0006
        command: 0x02
        mqtt_payload:
          state: "TOGGLE"
    telemetry:
      light_state:
        cluster: 0x0006
        attribute: 0x0000
