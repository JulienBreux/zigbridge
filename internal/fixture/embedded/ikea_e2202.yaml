schema_version: "1.0"
device:
    model: E2202
    vendor: IKEA
    description: BADRING water leakage sensor
    zigbee_models:
        - E2202
    endpoints:
        - endpoint: 1
          profile_id: 260
          device_id: 1026
          input_clusters:
            - 0
            - 1280
            - 1
          output_clusters: []
    exposes:
        - type: binary
          name: water_leak
          property: water_leak
          description: Indicates whether the device detected a water leak
          values:
            - "true"
            - "false"
          access: 1
        - type: numeric
          name: battery
          property: battery
          description: Remaining battery in %
          unit: '%'
          min: 0
          max: 100
          access: 1
        - type: numeric
          name: voltage
          property: voltage
          description: Reported battery voltage in millivolts
          unit: mV
          min: 2000
          max: 3500
          access: 1
        - type: numeric
          name: linkquality
          property: linkquality
          description: Radio link quality indicator
          unit: lqi
          min: 0
          max: 255
          access: 1
    simulations:
        actions:
            leak:
                cluster: 1280
                command: 0
                payload:
                    - 1
                    - 0
                mqtt_payload:
                    water_leak: true
            no_leak:
                cluster: 1280
                command: 0
                payload:
                    - 0
                    - 0
                mqtt_payload:
                    water_leak: false
        telemetry:
            battery:
                cluster: 1
                attribute: 33
                voltage_attribute: 32
            water_leak:
                cluster: 1280
                attribute: 2
