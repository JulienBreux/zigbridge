schema_version: "1.0"
device:
  model: "SNZB-01P"
  vendor: "SONOFF"
  description: "Wireless button"
  zigbee_models:
    - "SNZB-01P"
    - "WB01"

  endpoints:
    - endpoint: 1
      profile_id: 0x0104
      device_id: 0x0401
      input_clusters:
        - 0x0000
        - 0x0001
        - 0x0003
        - 0x0020
      output_clusters:
        - 0x0006

  exposes:
    - type: "enum"
      name: "action"
      property: "action"
      description: "Triggered button press action"
      values:
        - "single"
        - "double"
        - "long"
      access: 1

    - type: "numeric"
      name: "battery"
      property: "battery"
      unit: "%"
      min: 0
      max: 100
      description: "Remaining battery percentage"
      access: 1

    - type: "numeric"
      name: "voltage"
      property: "voltage"
      unit: "mV"
      min: 2500
      max: 3200
      description: "Battery voltage in millivolts"
      access: 1

    - type: "numeric"
      name: "linkquality"
      property: "linkquality"
      unit: "lqi"
      min: 0
      max: 255
      description: "Radio link quality indicator"
      access: 1

  simulations:
    actions:
      single:
        cluster: 0x0006
        command: 0x02
        mqtt_payload:
          action: "single"
      double:
        cluster: 0x0006
        command: 0x01
        mqtt_payload:
          action: "double"
      long:
        cluster: 0x0006
        command: 0x00
        mqtt_payload:
          action: "long"
    telemetry:
      battery:
        cluster: 0x0001
        attribute: 0x0021
        voltage_attribute: 0x0020
